[project]
name = "vibedraw"
version = "0.1.0"
description = "A visible agentic image-generation loop for Yandex AI Studio workshops."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.0,<7",
    "openai>=2.0,<3",
    "pillow>=10,<13",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "rich>=13,<15",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

